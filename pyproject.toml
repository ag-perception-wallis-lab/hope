[project]
name = "psihope"
version = "0.1.0"
description = "High-dimensional Online Particle Estimation (HOPE) for psychophysical experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Lars C. Reining", email = "lars.reining@tu-darmstadt.de" }
]
keywords = ["psychophysics", "particle filter", "adaptive methods", "bayesian"]
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "torch>=2.12.0",
]
[project.urls]
Homepage = "https://github.com/ag-perception-wallis-lab/hope"
Issues = "https://github.com/ag-perception-wallis-lab/hope/issues"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.13",
]

reproducibility = [
    "scikit-learn==1.7.2",
    "matplotlib==3.10.9",
    "pandas==2.3.3",
    "numpyro==0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hope"]